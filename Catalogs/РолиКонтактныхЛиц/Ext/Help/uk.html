<h1 class="">Довідник "Ролі контактних осіб"</h1>
<p class="Usual">У цьому довіднику користувач вводить ролі <a href="Catalog.КонтактныеЛица/Help">контактних осіб контрагентів</a> у структурі компанії-контрагента. </p>
<p class="Usual">Прикладами ролей може слугувати роль "Засновник" або "Власник" для контактної особи, яка перебуває на посаді генерального директора<br></p></body></html>
