<h1 class="">Довідник "Проекти"</h1>
<p class="Usual">Використання довідника проєктів дає змогу розділити дані господарської діяльності підприємства за напрямами.</p>
<p class="Usual">Це аналітичний розріз, що дає змогу групувати й аналізувати планові та фактичні дані з точки зору рентабельності та інших зведених показників.</p></body></html>
