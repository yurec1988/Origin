<h1 class="">Довідник "Комісії" </h1>
<p class="Usual">Довідник "Комісії" призначений для зберігання найменувань комісій, підписи членів яких використовуються під час друку документів.</p>
<p class="Usual">Відомості про склад комісій зберігаються в <a href="../idn0">регістрі відомостей "Склад комісій"</a>.<a href="../idn0"></a></p>
