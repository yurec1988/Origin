<h1 class="">Довідник "Об'єкти будівництва"</h1>
<p class="Usual">Довідник "Об'єкти будівництва" використовується в бухгалтерському та податковому обліку для ведення аналітичного обліку за об'єктами основних засобів, що будуються (модернізуються, реконструюються, монтуються).</p></body></html>
