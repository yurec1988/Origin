<h1 class="">Довідник "Групи подій"</h1>
<p class="">Довідник "Групи подій" призначений для класифікації документів <a href="Document.Событие/Help">"Подія"</a> оформлених для <a href="Catalog.Контрагенты/Help">контрагентів</a> або <a href="Catalog.КонтактныеЛица/Help">інших контактних осіб</a>. </p>
<p class="">Ця інформація може використовуватися для відбору даних у списку документів "Подія" або для відбору даних у звітах. </p></body></html>
