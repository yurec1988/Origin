<h1 class="">Регістр відомостей "Зустрічний випуск продукції (послуг)"</h1>
<p class="Usual">Регістр відомостей призначений для зазначення порядку розрахунку собівартості зустрічного випуску продукції та послуг.</p>
<p class="Usual">Регістр є періодичним, що дозволяє для різних періодів зазначати різний порядок розрахунку.</p></body></html>
