<h1 class="">Регістр відомостей "Порядок підрозділів для закриття рахунків"</h1>
<p class="Usual">Регістр відомостей призначений для зберігання послідовності підрозділів для закриття рахунків під час розрахунку собівартості випуску готової продукції та напівфабрикатів. </p></body></html>
