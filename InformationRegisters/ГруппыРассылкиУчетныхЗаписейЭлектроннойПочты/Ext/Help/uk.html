<h1 class="">Регістр відомостей "Групи розсилки облікових записів електронної пошти"</h1>
<p class="Usual">Регістр призначений для зберігання відповідностей <a href="Catalog.ГруппыПочтовойРассылки/Help">груп поштової розсилки</a> та <a href="Catalog.УчетныеЗаписиЭлектроннойПочты/Help">облікових записів</a>, у яких групи розсилки можуть використовуватися. Цю відповідність налаштовують у формі елемента довідника <a href="Catalog.ГруппыПочтовойРассылки/Help">групи поштової розсилки</a>.</p></body></html>
