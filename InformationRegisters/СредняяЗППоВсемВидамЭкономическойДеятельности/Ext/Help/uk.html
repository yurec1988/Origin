<h1 class="">Регістр відомостей "Середня ЗП за всіма видами економічної діяльності"</h1>
<p class="Usual">У регістрі вводяться розміри середньої зарплати за всіма видами економічної діяльності, необхідні для коректного розрахунку допомоги по вагітності та пологах.</p></body></html>
