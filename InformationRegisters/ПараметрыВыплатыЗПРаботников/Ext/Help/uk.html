<h1 class="">Працівники підприємства</h1>
<p class="Usual">Список фізичних осіб, які є працівниками підприємства (включаючи колишніх працівників). У списку відображаються підрозділ і посада працівника, а також його табельний номер.</p>
<p>Звільнені працівники відзначаються спеціальним значком.</p></body></html>
