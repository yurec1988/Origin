<h1 class="">Регістр відомостей "АВС-класифікація покупців"</h1>
<p class="Usual">У цьому періодичному регістрі відомостей зберігається історія зміни класу (важливості) покупців. Записи в регістр здійснюються під час проведення документів <a href="Document.ABCКлассификацияПокупателей/Help">"ABC-класифікація покупців"</a>.</p></body></html>
