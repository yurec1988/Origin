<h1 class="">Відомості про нарахування працівників організації</h1>
<p class="" style="MARGIN: 6pt 0cm 0pt 18pt">У цьому регістрі зберігається інформація про те, які нарахування слід проводити працівникові. Облікові записи в цьому регістрі з'являються під час проведення документів <a href="Document.ПриемНаРаботуВОрганизацию/Help">Прийом на роботу</a>, <a href="Document.КадровоеПеремещениеОрганизаций/Help">Кадрове переміщення</a> і <a href="Document.УвольнениеИзОрганизаций/Help">Звільнення</a>.</p></body></html>
