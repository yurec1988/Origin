<h1 class="">Регістр відомостей "Товари на ККМ"</h1>
<p class="Usual">У цьому регістрі відомостей зберігається список товарів, який буде завантажуватися в ККМ, підключену в режимі Offline. Вивантаження проводиться за допомогою обробки <a href="DataProcessor.ТОЗагрузкаККМOffline/Help">"Завантаження даних в ККМ, що підключаються в режимі Offline".</a></p></body></html>
