<h1 class="">Регістр відомостей "Норми податкової амортизації основних засобів".</h1>
<p class="">Цей регістр призначений для зберігання норм податкової амортизації основних засобів у розрізі податкових груп ОЗ. Він переодичний, тобто для кожної групи зазначається норма амортизації і дата, починаючи з якої ця норма діятиме.</p></body></html>
