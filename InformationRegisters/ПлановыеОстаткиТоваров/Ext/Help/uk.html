<h1 class="">Регістр відомостей "Планові залишки товарів"</h1>
<p class="Usual"></p>
<p class="Usual">Планові залишки вказуються в розрізі номенклатури та характеристик. Плануванню підлягають дані як за кількістю, так і за сумами та за сумою ПДВ.</p>
