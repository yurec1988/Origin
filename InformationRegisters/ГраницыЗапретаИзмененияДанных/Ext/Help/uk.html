<h1 class="">Регістр відомостей "Межі заборони зміни даних"</h1>
<p class="Usual">Регістр призначений для зберігання меж періоду заборони зміни даних у розрізі організацій і ролей користувачів.</p>
<p class="Usual">Настройка відповідних дат виконується в загальній формі <a href="CommonForm.УстановкаДатыЗапретаИзмененияДанных/Help">"Встановлення дати заборони зміни даних"</a>.</p></body></html>
