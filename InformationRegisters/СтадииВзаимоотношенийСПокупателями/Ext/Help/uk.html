<h1 class="">Регістр відомостей "Стадії взаємовідносин з покупцями"</h1>
<p class="Usual">У цьому періодичному регістрі відомостей зберігається історія зміни стадій взаємовідносин компанії з контрагентами. Записи в регістр здійснюються під час проведення документів <a href="Document.КлассификацияПокупателейПоСтадиямВзаимоотношений/Help">"Класифікація покупців за стадіями взаємовідносин"</a>.</p></body></html>
