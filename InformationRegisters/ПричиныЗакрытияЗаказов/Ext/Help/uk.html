<h1 class="">Регістр відомостей "Причини закриття замовлень"</h1>
<p class="Usual">Регістр призначений для зберігання відповідностей закритих замовлень <a href="Document.ЗаказПокупателя/Help">покупців</a>, <a href="Document.ЗаказПоставщику/Help">замовлень постачальникам</a> і <a href="Catalog.ПричиныЗакрытияЗаказов/Help">причин</a> їх закриття. Дані регістра використовуються у звіті <a href="Report.АнализПричинЗакрытияЗаказов/Help">"Аналіз причин закриття замовлень"</a>.</p></body></html>
