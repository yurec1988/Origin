<h1>Звіт "Аналіз погодження замовлення покупця"</h1>
<p class="Usual">Звіт "Аналіз погодження замовлення покупця" використовується для отримання інформації про поточний стан бізнес-процесу. До звіту виводиться інформація про поточний стан погодження, візи та рецензії користувачів за точками маршруту і циклами погодження. </p>
