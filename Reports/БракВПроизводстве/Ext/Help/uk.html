<h1 class="">Звіт "Брак у виробництві"</h1>
<p class="Usual">Цей звіт дає змогу проводити аналіз витрат на брак у міру їх виникнення.</p>
<p class="Usual">Звіт формується за даними управлінського обліку, у валюті управлінського обліку.</p>
<p class="Usual">У звіті можливе групування за підрозділами, статтями витрат, номенклатурними групами.</p>
<p class="Usual"></p>
