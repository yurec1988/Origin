<h1>Звіт "Статистика по задачам користувачів"</h1>
<p class="Usual">Звіт "Статистика по задачам користувачів" використовується для контролю й аналізу задач користувачів. У звіт виводиться інформація про кількість виконаних, невиконаних, протермінованих задач, згрупованих за користувачами і точками маршрутів. </p>
