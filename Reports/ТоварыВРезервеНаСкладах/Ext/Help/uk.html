<h1 class="">Звіт "Товари в резерві на складах"</h1>
<p class="Usual">Звіт показує кількість товарів, зарезервованих за <a href="Document.ЗаказПокупателя/Help">замовленнями покупців</a>, <a href="Document.ВнутреннийЗаказ/Help">внутрішніми замовленнями</a>, <a href="Document.ПриходныйОрдерНаТовары/Help">прибутковими ордерами</a> тощо. Звіт можна групувати за складами і деталізувати до рівня конкретного документа резерву.</p></body></html>
