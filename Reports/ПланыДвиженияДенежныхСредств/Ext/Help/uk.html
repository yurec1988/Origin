<h1 class="V8TopicText">Звіт "Плани руху грошових коштів"</h1>
<p class="Usual">Звіт "Плани руху грошових коштів" призначений для аналізу плану руху грошових коштів компанії за певним <a href="Catalog.СценарииПланирования/Help">сценарієм</a> за певний період. Обраний сценарій вказується в основній формі звіту.</p>
<p class="Usual">Звіт будується за оформленими раніше документами <a href="Document.ПланДвиженияДенежныхСредств/Help">"План руху грошових коштів".</a></p>
