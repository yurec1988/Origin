<h1>Звіт "Звіт за проводками"</h1>
<p style="MARGIN: 4pt 0pt 8pt; FONT-WEIGHT: bold; FONT-FACE: Verdana">Звіти <font size="2" face="Symbol">®</font> Звіт за проводками </p>
<p></p>
<p class="Usual">Звіт призначений для представлення списку кореспонденцій рахунків, відібраних за заданими критеріями.</p>
<p class="Usual">Кожен рядок звіту відповідає одній кореспонденції рахунків.</p>
<p class="Usual">У звіті можна встановити такі настройки:<br><br><a href="Subsystem.АналитическаяИнформация.Subsystem.СтандартныеОтчеты/Help#Показатели">Показники</a><br><a href="Subsystem.АналитическаяИнформация.Subsystem.СтандартныеОтчеты/Help#Отбор">Відбір</a><br><a href="Subsystem.АналитическаяИнформация.Subsystem.СтандартныеОтчеты/Help#Оформление">Оформлення</a></p></body></html>
