<h1 class="">Звіт "Штатна розстановка"</h1>
<p>У штатній розстановці підприємства можна вивести таку інформацію:</p>
<ul><li>Кількість запланованих і зайнятих робочих місць</li><li>ПІБ працівників, які займають конкретні робочі місця</li></ul><p></p>
<p>Звіт надає можливість групувати інформацію у розрізі підрозділів та/або посад.</p></body></html>
