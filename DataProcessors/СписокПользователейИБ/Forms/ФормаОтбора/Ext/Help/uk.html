<div id="V8TopicString">
<h1 class="V8TopicText">Відбір у списку користувачів</h1></div>
<div id="V8TextArea" valign="bottom">
<p class="Usual">Для зручності перегляду списку користувачів можна використовувати відбір.</p>
<p class="Usual">Відбір можна виконати за роллю, інтерфейсом, мовою та аутентифікацією.</p>
<p class="Usual">Встановіть позначки для тих ролей, інтерфейсів і мов, за якими потрібно відібрати значення у списку.</p></div></body></html>
