<h1>Оновлення правил обміну з конфігурацією "Роздріб"</h1>
<p></p>
<p>Призначена для оновлення правил обміну з конфігурацією "Роздріб". Правила обміну в настройках обміну даними з конфігурацією "Роздріб" будуть замінені новими правилами обміну.</p></body></html>
