<h1 class="">Документ "Формування платіжних документів за внесками до фондів" </h1>
<p>Документ призначений для автоматизації підготовки бланків платіжних доручень вихідних для перерахування внесків до фондів соціального страхування та податку на доходи фізичних осіб.</p></body></html>
