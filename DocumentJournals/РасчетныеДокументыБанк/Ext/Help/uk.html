<h1 class="">Журнал "Банківські розрахункові документи"</h1>
<p>У журналі відображаються документи, що змінюють залишок грошових коштів на рахунках організацій. За необхідності можна встановити відбір за організацією та (або) банківським рахунком, заповнивши поля "Організація" або "Банківський рахунок".</p></body></html>
