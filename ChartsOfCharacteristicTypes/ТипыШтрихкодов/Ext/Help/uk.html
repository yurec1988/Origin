<h1 class="">Типи штрихкодів</h1>
<p class="">У списку типів штрихкодів зберігаються всі типи штрихкодів, що використовуються в програмі. Ця інформація використовується під час формування штрихкодів у довіднику <a href="Catalog.Номенклатура/Help">"Номенклатура"</a> і <a href="DataProcessor.ПечатьЭтикеток/Help">друку етикеток</a> штрихкодів, а також під час зчитування штрихкодів за допомогою сканера штрихкодів.</p></body></html>
